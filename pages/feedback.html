<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/styles/index.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MindLog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNav" aria-controls="authNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="authNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-light btn-sm" href="login.html">Login</a>
                    <a class="btn btn-light btn-sm" href="reg.html">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-shell">
        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-2">Send Feedback</h2>
                <p class="text-center text-muted small mb-4">Help us improve MindLog</p>

                <div id="messageBox" class="message-box" role="alert" aria-live="polite"></div>

                <form id="feedbackForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email (optional)</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Brief summary" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">Details</label>
                        <textarea class="form-control" id="content" name="content" rows="5" placeholder="Describe your feedback..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="severity" class="form-label">Severity <span id="severityValue">5</span>/10</label>
                        <input type="range" class="form-range" id="severity" name="severity" min="1" max="10" value="5">
                        <small class="text-muted">1 = Low priority, 10 = Critical</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module" src="../static/scripts/feedback.js"></script>
</body>
</html>
