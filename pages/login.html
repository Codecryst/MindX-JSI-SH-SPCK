<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/styles/index.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-2">Welcome back</h2>
                <p class="text-center text-muted small mb-4">Sign in to your journal account</p>

                <div id="messageBox" class="message-box" role="alert" aria-live="polite"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>

                    <p class="text-center mt-3 mb-0">
                        Don't have an account? <a href="reg.html">Register here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="../static/scripts/login.js"></script>
</body>
</html>
