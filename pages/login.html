<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../static/styles/index.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <h2 class="mb-4 text-center fw-bold">Log in</h2>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email</label>
          <input id="loginEmail" class="form-control" type="email" placeholder="you@example.com" required />
        </div>

        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <input id="loginPassword" class="form-control" type="password" placeholder="Enter your password" required />
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <button class="btn btn-dark btn-main w-100" type="submit">Login</button>

        <div id="loginMessage" class="message-box" aria-live="polite"></div>
      </form>

      <div class="text-center mt-3">
        <span>Don't have an account? </span>
        <a href="reg.html" class="small-link">Create one</a>
      </div>
      <div class="text-center mt-2">
        <a href="index.html" class="small-link">Back to home</a>
      </div>
    </div>

    <script type="module" src="../static/scripts/login.js"></script>
  </body>
</html>
