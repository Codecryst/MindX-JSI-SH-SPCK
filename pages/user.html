<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/styles/index.css">
</head>
<body class="journal-page">
    <div class="journal-shell">
        <aside class="journal-sidebar">
            <div class="account-box">
                <div class="account-avatar" id="accountAvatar">U</div>
                <div class="account-info">
                    <small class="small-label">Account</small>
                    <h4 id="accountName">User</h4>
                </div>
            </div>

            <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="logoutBtn" style="margin-bottom: 16px;">Logout</button>

            <a href="admin.html" id="dashboardLink" class="small d-none mb-3 d-block" style="margin-bottom: 16px;">← Back to dashboard</a>

            <div class="sidebar-header">
                <h3>Entries</h3>
                <button type="button" class="btn btn-sm btn-dark" id="newEntryBtn">New</button>
            </div>

            <div id="entriesList" class="entries-list"></div>
        </aside>

        <main class="journal-editor">
            <div class="editor-box">
                <div class="editor-toolbar">
                    <span class="toolbar-title">Entry</span>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="clearEditorBtn">Clear</button>
                </div>

                <input type="text" id="entryHeader" class="form-control mb-3" placeholder="Entry header" maxlength="80">
                <textarea id="entryContent" class="form-control" rows="14" placeholder="Write your thoughts here..."></textarea>

                <div class="editor-actions">
                    <button type="button" id="saveEntryBtn" class="btn btn-primary">Save entry</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../static/scripts/user.js"></script>
</body>
</html>
