<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/styles/index.css">
</head>
<body class="journal-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MindLog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNav" aria-controls="userNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="userNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="index.html" class="d-none align-items-center gap-2 text-decoration-none" id="navAccount">
                        <span class="nav-avatar" id="navAvatar">U</span>
                        <span class="text-light fw-bold small" id="navName">User</span>
                    </a>
                    <button type="button" class="btn btn-outline-light btn-sm d-none" id="navLogoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="journal-shell">
        <aside class="journal-sidebar">
            <div class="account-box">
                <div class="account-avatar" id="accountAvatar">U</div>
                <div class="account-info">
                    <small class="small-label">Account</small>
                    <h4 id="accountName">User</h4>
                </div>
            </div>

            <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="logoutBtn" style="margin-bottom: 16px;">Logout</button>

            <a href="admin.html" id="dashboardLink" class="small d-none mb-3 d-block" style="margin-bottom: 16px;">← Back to dashboard</a>

            <div class="sidebar-header">
                <h3>Entries</h3>
                <button type="button" class="btn btn-sm btn-dark" id="newEntryBtn">New</button>
            </div>

            <div id="entriesList" class="entries-list"></div>
        </aside>

        <main class="journal-editor">
            <div class="editor-box">
                <div class="editor-toolbar">
                    <span class="toolbar-title">Entry</span>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="clearEditorBtn">Clear</button>
                </div>

                <input type="text" id="entryHeader" class="form-control mb-3" placeholder="Entry header" maxlength="80">
                <textarea id="entryContent" class="form-control" rows="14" placeholder="Write your thoughts here..."></textarea>

                <div class="editor-actions">
                    <button type="button" id="saveEntryBtn" class="btn btn-primary">Save entry</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module" src="../static/scripts/user.js"></script>
</body>
</html>
